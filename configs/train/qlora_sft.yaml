id: qlora_sft
method: qlora_sft
trainer: trl.SFTTrainer
precision: bf16
seed: 42
max_seq_length: 2048
num_train_epochs: 3
learning_rate: 2.0e-4
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
warmup_ratio: 0.03
weight_decay: 0.0
lr_scheduler_type: cosine
packing: false
gradient_checkpointing: true
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

