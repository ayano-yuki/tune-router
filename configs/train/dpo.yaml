id: dpo
method: dpo
trainer: trl.DPOTrainer
precision: bf16
seed: 42
max_seq_length: 2048
max_prompt_length: 1024
num_train_epochs: 1
learning_rate: 5.0e-6
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
warmup_ratio: 0.1
lr_scheduler_type: cosine
beta: 0.1
lora:
  r: 32
  alpha: 64
  dropout: 0.05

