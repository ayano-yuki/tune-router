id: full_sft
method: full_sft
trainer: trl.SFTTrainer
precision: bf16
seed: 42
max_seq_length: 2048
num_train_epochs: 3
learning_rate: 1.0e-5
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
warmup_ratio: 0.03
weight_decay: 0.1
lr_scheduler_type: cosine
packing: false
gradient_checkpointing: true

