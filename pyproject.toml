[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunescope"
version = "0.1.0"
description = "Reproducible comparison harness for Japanese instruction tuning methods."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "bitsandbytes>=0.49.2",
  "datasets>=2.20",
  "evaluate>=0.4",
  "huggingface-hub>=0.34",
  "peft>=0.11",
  "pyyaml>=6.0",
  "transformers>=4.43",
  "trl>=0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
tunescope = "tunescope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
